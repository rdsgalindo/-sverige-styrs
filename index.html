<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hur Sverige styrs</title>

<style>
body { font-family: Arial; max-width: 1000px; margin:auto; padding:20px; background:#f4f6f8;}
h1,h2{text-align:center;}
.card{background:white;padding:20px;margin:20px 0;border-radius:10px;}
button{margin:5px;padding:10px;border:none;border-radius:6px;cursor:pointer;}
.correct{color:green;}
.wrong{color:red;}
.feedback{font-weight:bold;}
</style>
</head>

<body>

<h1>Hur Sverige styrs</h1>

<div class="card">
<h2>Begrepp</h2>
<div id="terms"></div>
</div>

<div class="card">
<h2>Hur går det till?</h2>
<div id="process"></div>
</div>

<div class="card">
<h2>Quiz</h2>
<div id="quiz"></div>
</div>

<div class="card">
<h2>Vem ansvarar?</h2>
<div id="responsibility"></div>
</div>

<div class="card">
<h2>Tänk till</h2>
<div id="reflection"></div>
</div>

<h2>Poäng: <span id="score">0</span></h2>

<script>

let score = 0;

function updateScore(){
document.getElementById("score").textContent = score;
}

const terms = [

{word:"Demokrati", explanation:"Folkstyre där medborgarna väljer politiker."},
{word:"Proportionell demokrati", explanation:"Partier får mandat i proportion till röster."},

{word:"Riksdag", explanation:"Stiftar lagar och beslutar om budget."},
{word:"Ledamot", explanation:"En person i riksdagen."},
{word:"Talman", explanation:"Leder riksdagen och föreslår statsminister."},

{word:"Regering", explanation:"Styr landet och genomför beslut."},
{word:"Statsminister", explanation:"Leder regeringen."},
{word:"Statschef", explanation:"Kungen, representativ roll utan politisk makt."},

{word:"Proposition", explanation:"Förslag från regeringen."},
{word:"Motion", explanation:"Förslag från riksdagsledamöter."},
{word:"Utskott", explanation:"Förbereder beslut i riksdagen."},
{word:"Betänkande", explanation:"Utskottets förslag till beslut."},

{word:"Kommun", explanation:"Ansvarar för skola, äldreomsorg m.m."},
{word:"Region", explanation:"Ansvarar för sjukvård och kollektivtrafik."},
{word:"Stat", explanation:"Ansvarar för polis, försvar, lagar."},

{word:"Myndighet", explanation:"Genomför beslut."},
{word:"Domstol", explanation:"Dömer enligt lagar."},

{word:"EU", explanation:"Samarbete mellan europeiska länder."},

{word:"Politiska partier", explanation:"Grupper som vill påverka hur samhället styrs."},

{word:"Socialdemokraterna", explanation:"Fokus på välfärd och jämlikhet."},
{word:"Moderaterna", explanation:"Fokus på lägre skatter och individens ansvar."},
{word:"Sverigedemokraterna", explanation:"Fokus på invandring och lag och ordning."},
{word:"Centerpartiet", explanation:"Fokus på landsbygd och företagande."},
{word:"Vänsterpartiet", explanation:"Fokus på jämlikhet och stark välfärd."},
{word:"Kristdemokraterna", explanation:"Fokus på familj och värderingar."},
{word:"Liberalerna", explanation:"Fokus på utbildning och individens frihet."},
{word:"Miljöpartiet", explanation:"Fokus på miljö och klimat."}

];

const processTexts = [
"Val hålls där medborgarna röstar",
"Riksdagen bildas",
"Talmannen föreslår statsminister",
"Regering bildas",
"Förslag (proposition/motion) lämnas",
"Utskott granskar",
"Betänkande skrivs",
"Riksdagen röstar",
"Beslut genomförs"
];

const quizQuestions = [

{q:"Vad är en proposition?", options:["Förslag från regeringen","Dom i domstol","Kommunbeslut"], answer:0},
{q:"Vad är en motion?", options:["Förslag från ledamöter","EU-beslut","Lag"], answer:0},
{q:"Vad gör riksdagen?", options:["Stiftar lagar","Driver sjukhus","Dömer"], answer:0},
{q:"Vad gör regeringen?", options:["Styr landet","Dömer","Undervisar"], answer:0},
{q:"Vad gör utskott?", options:["Förbereder beslut","Dömer","Styr kommun"], answer:0},
{q:"Vad avgör mandat?", options:["Röster i val","Regeringen","Domstol"], answer:0},
{q:"Vad gör partier?", options:["Påverkar politik","Dömer","Bygger vägar"], answer:0}

];

const responsibilityQuestions = [

{q:"Skola?", options:["Kommun","Region","Stat","EU"], answer:0},
{q:"Sjukvård?", options:["Kommun","Region","Stat","EU"], answer:1},
{q:"Polis?", options:["Kommun","Region","Stat","EU"], answer:2},
{q:"EU-samarbete?", options:["Kommun","Region","Stat","EU"], answer:3}

];

const reflectionQuestions = [
"Vad är skillnaden mellan proposition och motion?",
"Varför finns utskott?",
"Varför finns flera partier?",
"Varför delas makten mellan nivåer?"
];

function renderTerms(){
const div=document.getElementById("terms");
terms.forEach(t=>{
let el=document.createElement("p");
el.innerHTML="<b>"+t.word+"</b>: "+t.explanation;
div.appendChild(el);
});
}

function renderProcess(){
const div=document.getElementById("process");
processTexts.forEach(t=>{
let el=document.createElement("p");
el.textContent=t;
div.appendChild(el);
});
}

function renderQuestions(container, questions){
const div=document.getElementById(container);

questions.forEach(q=>{
let el=document.createElement("div");

let p=document.createElement("p");
p.innerHTML="<b>"+q.q+"</b>";
el.appendChild(p);

let answered=false;

q.options.forEach((opt,i)=>{
let btn=document.createElement("button");
btn.textContent=opt;

btn.onclick=()=>{
if(answered) return;
answered=true;

let feedback=document.createElement("div");

if(i===q.answer){
feedback.textContent="Rätt";
feedback.className="feedback correct";
score++;
updateScore();
}else{
feedback.textContent="Fel";
feedback.className="feedback wrong";
}

el.appendChild(feedback);
};

el.appendChild(btn);
});

div.appendChild(el);
});
}

function renderReflection(){
const div=document.getElementById("reflection");
reflectionQuestions.forEach(q=>{
let el=document.createElement("p");
el.innerHTML="<b>"+q+"</b>";
div.appendChild(el);
});
}

renderTerms();
renderProcess();
renderQuestions("quiz",quizQuestions);
renderQuestions("responsibility",responsibilityQuestions);
renderReflection();
updateScore();

</script>

</body>
</html>
